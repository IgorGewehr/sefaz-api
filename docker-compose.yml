services:
  postgres:
    image: postgres:16-alpine
    container_name: sefaz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sefaz
      POSTGRES_PASSWORD: sefaz
      POSTGRES_DB: sefaz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sefaz -d sefaz"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sefaz-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    container_name: sefaz-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://sefaz:sefaz@postgres:5432/sefaz?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:3333
      # KMS local — chave gerada por openssl rand -hex 32 (dev-only)
      KMS_PROVIDER: local
      KMS_LOCAL_MASTER_KEY: ${KMS_LOCAL_MASTER_KEY}
      # Storage local em volume persistente
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/.storage
      # Resp técnico (NT 2018.005) — preencher no .env
      RESP_TEC_CNPJ: ${RESP_TEC_CNPJ:-00000000000000}
      RESP_TEC_CONTATO: ${RESP_TEC_CONTATO:-Suporte}
      RESP_TEC_EMAIL: ${RESP_TEC_EMAIL:-suporte@example.com}
      RESP_TEC_FONE: ${RESP_TEC_FONE:-1100000000}
      # Multi-tenant bootstrap
      ADMIN_TENANT_NAME: ${ADMIN_TENANT_NAME:-Sefaz API Admin}
      ADMIN_TENANT_EMAIL: ${ADMIN_TENANT_EMAIL:-admin@example.com}
      # Misc
      LOG_LEVEL: info
      SWAGGER_ENABLED: "true"
      SEFAZ_DEFAULT_AMBIENTE: homologacao
      VALIDATE_CERT_CNPJ: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "3333:3333"
    volumes:
      - storage-data:/app/.storage
    command: ["sh", "/app/scripts/start-api.sh"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/health',(r)=>process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      target: worker
    container_name: sefaz-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sefaz:sefaz@postgres:5432/sefaz?schema=public
      REDIS_URL: redis://redis:6379
      KMS_PROVIDER: local
      KMS_LOCAL_MASTER_KEY: ${KMS_LOCAL_MASTER_KEY}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/.storage
      LOG_LEVEL: info
      WEBHOOK_MAX_ATTEMPTS: "3"
      WEBHOOK_TIMEOUT_MS: "10000"
    volumes:
      - storage-data:/app/.storage

volumes:
  postgres-data:
  redis-data:
  storage-data:
